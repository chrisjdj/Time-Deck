    <title>Time-Deck — Clocks, Timers & World Time</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Time-Deck",
        "operatingSystem": "All",
        "applicationCategory": "UtilitiesApplication",
        "description": "Full-screen clocks, countdowns, stopwatch, world clocks, meeting planner, presenter and exam timers. Runs entirely in the browser.",
        "url": "https://chrisjdj.github.io/web-tools/Time-Deck/",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('time-deck:v1');
          var pref = raw ? JSON.parse(raw).themePref : 'system';
          var t = pref === 'light' || pref === 'dark' ? pref : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <noscript>Time-Deck needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
